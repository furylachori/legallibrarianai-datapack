steps:
  - name: node:26.3.0-bookworm-slim
    id: Corpus metadata and closure gates
    entrypoint: bash
    args:
      - -euc
      - |
        npm ci
        ./node_modules/.bin/vite-node tools/build-corpus-inventory.ts > /tmp/cloudbuild-inventory.json
