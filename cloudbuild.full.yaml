steps:
  - name: node:26.3.0-bookworm-slim
    id: Corpus fixture build and reproducibility gates
    entrypoint: bash
    args:
      - -euc
      - |
        npm ci
        ./node_modules/.bin/vite-node tools/build-corpus-inventory.ts > /tmp/cloudbuild-inventory.json
        node tools/cloudbuild-data-gates.mjs /tmp/cloudbuild-inventory.json
        ./node_modules/.bin/vitest run tools/build-closure.test.ts
        rm -rf /tmp/cloudbuild-corpus-a /tmp/cloudbuild-corpus-b
        ./node_modules/.bin/vite-node scripts/build-corpus-artifact.ts --fixturesDir fixtures/full --outDir /tmp/cloudbuild-corpus-a
        ./node_modules/.bin/vite-node scripts/build-corpus-artifact.ts --fixturesDir fixtures/full --outDir /tmp/cloudbuild-corpus-b
        diff -r /tmp/cloudbuild-corpus-a /tmp/cloudbuild-corpus-b
        cmp /tmp/cloudbuild-corpus-a/NOTICE-SINALEVI.txt LEGAL_CORPUS_NOTICE.txt
timeout: 3600s
options:
  machineType: E2_STANDARD_2
  logging: CLOUD_LOGGING_ONLY
serviceAccount: projects/project-33a976dd-e360-4c43-8d9/serviceAccounts/ci-pr-smoke@project-33a976dd-e360-4c43-8d9.iam.gserviceaccount.com
